<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>🍩</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(
          circle at 50% 35%,
          #2b2018 0%,
          #120d0a 42%,
          #050403 100%
        );
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      position: relative;
    }

    #scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;

      background:
        radial-gradient(
          circle at center,
          transparent 20%,
          rgba(0, 0, 0, 0.2) 55%,
          rgba(0, 0, 0, 0.9) 100%
        );
    }

    .ui {
      position: fixed;
      inset: 0;
      pointer-events: none;
      color: white;
    }

    .top {
      position: absolute;
      top: 32px;
      left: 40px;

      opacity: 0;
      transform: translateY(-20px);
    }

    .top h1 {
      font-size: 13px;
      letter-spacing: 7px;
      font-weight: 600;
      text-transform: uppercase;
      opacity: 0.55;
    }

    .center-text {
      position: absolute;

      left: 50%;
      bottom: 55px;

      transform: translateX(-50%);

      text-align: center;

      opacity: 0;
    }

    .center-text h2 {
      font-size: clamp(30px, 5vw, 70px);

      font-weight: 800;
      letter-spacing: -3px;

      background: linear-gradient(
        90deg,
        #ffffff,
        #ff8bd4,
        #9b8cff,
        #ffffff
      );

      background-size: 300% 100%;

      -webkit-background-clip: text;
      background-clip: text;

      color: transparent;

      animation: gradient 5s linear infinite;
    }

    .center-text p {
      margin-top: 8px;

      font-size: 11px;
      letter-spacing: 5px;

      opacity: 0.45;

      text-transform: uppercase;
    }

    @keyframes gradient {
      0% {
        background-position: 0% 50%;
      }

      100% {
        background-position: 300% 50%;
      }
    }

    .loading {
      position: fixed;
      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        radial-gradient(
          circle at 50% 35%,
          #2b2018 0%,
          #120d0a 42%,
          #050403 100%
        );

      z-index: 10;

      color: white;

      font-size: 11px;
      letter-spacing: 6px;

      transition: opacity 0.8s ease;
    }

    .loading.hidden {
      opacity: 0;
      pointer-events: none;
    }

    @media (max-width: 600px) {
      .top {
        left: 20px;
        top: 20px;
      }

      .center-text {
        bottom: 30px;
      }

      .center-text h2 {
        letter-spacing: -1px;
      }
    }
  </style>
</head>

<body>

  <div class="loading" id="loading">
    LOADING
  </div>

  <canvas id="scene"></canvas>

  <div class="vignette"></div>

  <div class="ui">

 
  </div>


  <!-- Three.js -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.178.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.178.0/examples/jsm/"
    }
  }
  </script>


  <!-- GSAP -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>


  <script type="module">

    import * as THREE from "three";

    // ============================================================
    // SETUP
    // ============================================================

    const canvas = document.getElementById("scene");

    const scene = new THREE.Scene();

    scene.background = null;

    scene.fog = new THREE.Fog(0x120d0a, 8, 18);

    // ============================================================
    // CAMERA
    // ============================================================

    const camera = new THREE.PerspectiveCamera(
      45,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );

    camera.position.set(0, 0.2, 7);

    camera.position.z = 6.4;


    // ============================================================
    // RENDERER
    // ============================================================

    const renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: true,
      alpha: true
    });

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

    renderer.setPixelRatio(
      Math.min(window.devicePixelRatio, 2)
    );

    renderer.outputColorSpace = THREE.SRGBColorSpace;

    renderer.toneMapping =
      THREE.ACESFilmicToneMapping;

    renderer.toneMappingExposure = 1.08;

    renderer.shadowMap.enabled = true;

    renderer.shadowMap.type = THREE.PCFSoftShadowMap;


    // ============================================================
    // SURFACE HELPERS
    // ============================================================

    function sculptTorusGeometry(
      geometry,
      majorRadius,
      strength,
      seed
    ) {

      geometry.computeVertexNormals();

      const position =
        geometry.attributes.position;

      const normal =
        geometry.attributes.normal;

      const vertex = new THREE.Vector3();

      const normalVector = new THREE.Vector3();

      for (
        let i = 0;
        i < position.count;
        i++
      ) {

        vertex.fromBufferAttribute(
          position,
          i
        );

        normalVector.fromBufferAttribute(
          normal,
          i
        );

        const ringAngle =
          Math.atan2(
            vertex.z,
            vertex.x
          );

        const radialDistance =
          Math.sqrt(
            vertex.x * vertex.x +
            vertex.z * vertex.z
          );

        const tubeAngle =
          Math.atan2(
            vertex.y,
            radialDistance - majorRadius
          );

        const grain =
          Math.sin(
            ringAngle * 7.0 + seed
          ) * 0.55 +
          Math.cos(
            tubeAngle * 9.0 - seed * 1.3
          ) * 0.35 +
          Math.sin(
            (vertex.x + vertex.y + vertex.z) * 2.3 +
            seed * 0.8
          ) * 0.25;

        vertex.addScaledVector(
          normalVector,
          strength * grain
        );

        position.setXYZ(
          i,
          vertex.x,
          vertex.y,
          vertex.z
        );

      }

      position.needsUpdate = true;

      geometry.computeVertexNormals();

      geometry.computeBoundingSphere();

    }


    function createSoftShadowTexture() {

      const shadowCanvas =
        document.createElement("canvas");

      shadowCanvas.width = 256;

      shadowCanvas.height = 256;

      const context =
        shadowCanvas.getContext("2d");

      const gradient =
        context.createRadialGradient(
          128,
          128,
          20,
          128,
          128,
          120
        );

      gradient.addColorStop(
        0,
        "rgba(0, 0, 0, 0.38)"
      );

      gradient.addColorStop(
        0.45,
        "rgba(0, 0, 0, 0.16)"
      );

      gradient.addColorStop(
        1,
        "rgba(0, 0, 0, 0)"
      );

      context.fillStyle = gradient;
      context.fillRect(0, 0, 256, 256);

      const texture =
        new THREE.CanvasTexture(
          shadowCanvas
        );

      texture.colorSpace =
        THREE.SRGBColorSpace;

      return texture;

    }


    const shadowTexture =
      createSoftShadowTexture();


    // ============================================================
    // GROUP
    // ============================================================

    const donutGroup = new THREE.Group();

    donutGroup.rotation.x = 0.42;

    scene.add(donutGroup);


    // ============================================================
    // GROUND SHADOW
    // ============================================================

    const groundShadow =
      new THREE.Mesh(
        new THREE.PlaneGeometry(6.4, 2.6),
        new THREE.MeshBasicMaterial({

          map: shadowTexture,

          transparent: true,

          opacity: 0.9,

          depthWrite: false

        })
      );


    groundShadow.rotation.x =
      -Math.PI / 2;

    groundShadow.position.y = -1.18;

    groundShadow.scale.set(
      1.18,
      1,
      1
    );

    scene.add(groundShadow);


    // ============================================================
    // DONUT 🍩
    // ============================================================

    const donutGeometry =
      new THREE.TorusGeometry(
        2,
        0.76,
        96,
        220
      );


    sculptTorusGeometry(
      donutGeometry,
      2,
      0.04,
      1.4
    );


    const donutMaterial =
      new THREE.MeshPhysicalMaterial({

        color: 0xc78b52,

        roughness: 0.94,

        metalness: 0,

        clearcoat: 0.05,

        clearcoatRoughness: 0.85,

        emissive: 0x1d0e07,

        emissiveIntensity: 0.08

      });


    const donut =
      new THREE.Mesh(
        donutGeometry,
        donutMaterial
      );


    donut.castShadow = true;

    donut.receiveShadow = true;


    donutGroup.add(donut);


    // ============================================================
    // BAKED CRUST
    // ============================================================

    const crustGeometry =
      new THREE.TorusGeometry(
        2.01,
        0.775,
        96,
        220
      );


    sculptTorusGeometry(
      crustGeometry,
      2.01,
      0.015,
      3.6
    );


    const crustMaterial =
      new THREE.MeshPhysicalMaterial({

        color: 0xa96b36,

        roughness: 1,

        metalness: 0,

        transparent: true,

        opacity: 0.28,

        depthWrite: false

      });


    const crust =
      new THREE.Mesh(
        crustGeometry,
        crustMaterial
      );


    crust.rotation.z = 0.02;

    donutGroup.add(crust);


    // ============================================================
    // GLAZE
    // ============================================================

    const glazeGeometry =
      new THREE.TorusGeometry(
        2.02,
        0.79,
        96,
        220
      );


    sculptTorusGeometry(
      glazeGeometry,
      2.02,
      0.014,
      5.2
    );


    const glazeMaterial =
      new THREE.MeshPhysicalMaterial({

        color: 0x5a321e,

        roughness: 0.36,

        metalness: 0,

        clearcoat: 0.9,

        clearcoatRoughness: 0.08,

        transparent: true,

        opacity: 0.92,

        depthWrite: false,

        emissive: 0x1d0f09,

        emissiveIntensity: 0.06

      });


    const glaze =
      new THREE.Mesh(
        glazeGeometry,
        glazeMaterial
      );


    glaze.position.y = 0.03;

    glaze.rotation.z = -0.012;

    donutGroup.add(glaze);


    // Keep the surface clean so the donut reads as a real pastry.


    // ============================================================
    // LIGHTING
    // ============================================================

    const ambient =
      new THREE.AmbientLight(
        0xffffff,
        0.72
      );

    scene.add(ambient);


    const hemisphere =
      new THREE.HemisphereLight(
        0xfff3e1,
        0x7b4422,
        1.1
      );

    scene.add(hemisphere);


    const keyLight =
      new THREE.PointLight(
        0xfff1db,
        18,
        16
      );

    keyLight.position.set(
      -3.5,
      4.5,
      5.5
    );

    scene.add(keyLight);



    const fillLight =
      new THREE.PointLight(
        0xb96c49,
        7,
        18
      );

    fillLight.position.set(
      3.5,
      0.5,
      4
    );

    scene.add(fillLight);


    const pinkLight = keyLight;


    const blueLight = fillLight;



    const rimLight =
      new THREE.DirectionalLight(
        0xffc89c,
        1.15
      );

    rimLight.position.set(
      2,
      -1,
      -2
    );

    scene.add(rimLight);


    // ============================================================
    // PARTICLES ✨
    // ============================================================

    const particleCount = 900;


    const particlePositions =
      new Float32Array(
        particleCount * 3
      );


    for (
      let i = 0;
      i < particleCount;
      i++
    ) {

      const radius =
        8 + Math.random() * 12;

      const theta =
        Math.random() * Math.PI * 2;

      const phi =
        Math.acos(
          2 * Math.random() - 1
        );


      particlePositions[
        i * 3
      ] =
        radius *
        Math.sin(phi) *
        Math.cos(theta);


      particlePositions[
        i * 3 + 1
      ] =
        radius *
        Math.sin(phi) *
        Math.sin(theta);


      particlePositions[
        i * 3 + 2
      ] =
        radius *
        Math.cos(phi);

    }


    const particleGeometry =
      new THREE.BufferGeometry();


    particleGeometry.setAttribute(
      "position",
      new THREE.BufferAttribute(
        particlePositions,
        3
      )
    );


    const particleMaterial =
      new THREE.PointsMaterial({

        color: 0xffffff,

        size: 0.025,

        transparent: true,

        opacity: 0.65,

        depthWrite: false

      });


    const particles =
      new THREE.Points(
        particleGeometry,
        particleMaterial
      );


    scene.add(particles);


    particles.visible = false;


    // ============================================================
    // GLOW RINGS
    // ============================================================

    const ringGroup =
      new THREE.Group();


    scene.add(ringGroup);


    ringGroup.visible = false;


    for (
      let i = 0;
      i < 3;
      i++
    ) {

      const ringGeometry =
        new THREE.TorusGeometry(
          3.5 + i * 0.7,
          0.008,
          16,
          128
        );


      const ringMaterial =
        new THREE.MeshBasicMaterial({

          color:
            i % 2 === 0
              ? 0xff4fa3
              : 0x596bff,

          transparent: true,

          opacity: 0.35

        });


      const ring =
        new THREE.Mesh(
          ringGeometry,
          ringMaterial
        );


      ring.rotation.x =
        Math.PI / 2;


      ringGroup.add(ring);

    }


    // ============================================================
    // MOUSE INTERACTION
    // ============================================================

    const mouse = {
      x: 0,
      y: 0
    };


    const targetRotation = {
      x: 0.35,
      y: 0
    };


    window.addEventListener(
      "mousemove",
      (event) => {

        mouse.x =
          (event.clientX /
            window.innerWidth) *
            2 -
          1;

        mouse.y =
          (event.clientY /
            window.innerHeight) *
            2 -
          1;


        gsap.to(
          targetRotation,
          {
            x:
              0.35 +
              mouse.y * 0.25,

            y:
              mouse.x * 0.45,

            duration: 1.2,

            ease: "power3.out",

            overwrite: true
          }
        );

      }
    );


    // ============================================================
    // GSAP INTRO
    // ============================================================

    donutGroup.scale.set(
      0.01,
      0.01,
      0.01
    );


    donutGroup.position.y = -1;


    gsap.to(
      donutGroup.scale,
      {
        x: 1,
        y: 1,
        z: 1,

        duration: 1.8,

        ease: "elastic.out(1, 0.55)"
      }
    );


    gsap.to(
      donutGroup.position,
      {
        y: 0,

        duration: 1.5,

        ease: "power4.out"
      }
    );


    gsap.to(
      "#top",
      {
        opacity: 1,

        y: 20,

        duration: 1.2,

        delay: 0.5,

        ease: "power3.out"
      }
    );


    gsap.to(
      "#text",
      {
        opacity: 1,

        duration: 1.5,

        delay: 1.2,

        ease: "power2.out"
      }
    );


    // ============================================================
    // CONTINUOUS DONUT ROTATION
    // ============================================================

    gsap.to(
      donutGroup.rotation,
      {
        y: Math.PI * 2,

        duration: 12,

        repeat: -1,

        ease: "none"
      }
    );


    // ============================================================
    // PARTICLE ROTATION
    // ============================================================

    gsap.to(
      particles.rotation,
      {
        y: Math.PI * 2,

        x: Math.PI * 0.3,

        duration: 80,

        repeat: -1,

        ease: "none"
      }
    );


    // ============================================================
    // RING ANIMATION
    // ============================================================

    gsap.to(
      ringGroup.rotation,
      {
        z: Math.PI * 2,

        duration: 25,

        repeat: -1,

        ease: "none"
      }
    );


    // ============================================================
    // FLOATING MOTION
    // ============================================================

    gsap.to(
      donutGroup.position,
      {
        y: 0.18,

        duration: 2.8,

        repeat: -1,

        yoyo: true,

        ease: "sine.inOut"
      }
    );


    // ============================================================
    // LIGHT ANIMATION
    // ============================================================

    gsap.to(
      pinkLight.position,
      {
        x: 4,

        z: -4,

        duration: 5,

        repeat: -1,

        yoyo: true,

        ease: "sine.inOut"
      }
    );


    gsap.to(
      blueLight.position,
      {
        x: -4,

        z: 4,

        duration: 6,

        repeat: -1,

        yoyo: true,

        ease: "sine.inOut"
      }
    );


    // ============================================================
    // ANIMATION LOOP
    // ============================================================

    const clock =
      new THREE.Clock();


    function animate() {

      requestAnimationFrame(
        animate
      );


      const elapsed =
        clock.getElapsedTime();


      /*
        Smooth mouse-controlled
        rotation.
      */

      donutGroup.rotation.x +=
        (
          targetRotation.x -
          donutGroup.rotation.x
        ) * 0.035;


      /*
        Subtle floating movement
      */

      ringGroup.position.y =
        Math.sin(elapsed * 0.5) *
        0.1;


      /*
        Tiny particle movement
      */

      particles.position.y =
        Math.sin(elapsed * 0.12) *
        0.15;


      renderer.render(
        scene,
        camera
      );

    }


    animate();


    // ============================================================
    // RESIZE
    // ============================================================

    window.addEventListener(
      "resize",
      () => {

        camera.aspect =
          window.innerWidth /
          window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
          window.innerWidth,
          window.innerHeight
        );


        renderer.setPixelRatio(
          Math.min(
            window.devicePixelRatio,
            2
          )
        );

      }
    );


    // ============================================================
    // REMOVE LOADING SCREEN
    // ============================================================

    window.addEventListener(
      "load",
      () => {

        setTimeout(() => {

          document
            .getElementById("loading")
            .classList.add("hidden");

        }, 500);

      }
    );

  </script>

</body>
</html>
